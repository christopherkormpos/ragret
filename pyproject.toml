[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ragret"
version = "0.2.2"
description = "Lightweight evaluation framework for Retrieval Augmented Generation systems, focused on simplicity and long-term consistency."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Christopher Kormpos" }
]

dependencies = [
    "openai>=1.0.0",
    "google-genai>=2.8.0",
    "tiktoken>=0.13.0",
    "numpy>=1.23.0",
    "pandas>=2.0.0",
    "tqdm>=4.0.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/christopherkormpos/ragret"
Repository = "https://github.com/christopherkormpos/ragret"

[tool.setuptools.packages.find]
where = ["."]
include = ["ragret*"]